plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shuabroad.academy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shuabroad.academy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-internal'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

