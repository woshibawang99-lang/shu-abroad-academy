<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination - ShuAbroadAcademy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        mark.exam-highlight { background:#fde68a; color:#334155; border-radius:3px; padding:0 2px; }
        .exam-paper { user-select:text; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap gap-3 justify-between items-center">
            <div>
                <div class="font-black text-slate-900"><i class="fa-solid fa-graduation-cap text-violet-600 mr-2"></i>ShuAbroadAcademy Online Examination</div>
                <div id="exam-page-title" class="text-xs text-slate-500 mt-0.5">Loading examination...</div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="highlightSelectedKeyword()" class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-xl text-xs font-bold"><i class="fa-solid fa-highlighter mr-1"></i>Highlight Selected Text</button>
                <button onclick="clearKeywordHighlights()" class="bg-slate-100 text-slate-600 border border-slate-200 px-3 py-2 rounded-xl text-xs font-bold">Clear Highlights</button>
                <div id="standalone-countdown" class="font-mono text-xl font-black text-rose-600 bg-rose-50 border border-rose-200 px-4 py-2 rounded-xl">00:00</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-5">
        <aside class="bg-white border border-slate-200 rounded-2xl p-4 h-fit lg:sticky lg:top-24 shadow-sm">
            <div class="font-bold text-sm text-slate-800 mb-3">Question Navigator</div>
            <div id="exam-question-nav" class="grid grid-cols-5 gap-2"></div>
            <div class="text-[11px] text-slate-500 mt-4 leading-relaxed">Select text in a question, then click “Highlight Selected Text” to mark keywords.</div>
        </aside>

        <section class="space-y-5">
            <div id="standalone-exam-message" class="hidden bg-white border border-slate-200 rounded-2xl p-10 text-center shadow-sm"></div>
            <div id="standalone-exam-paper" class="exam-paper space-y-5"></div>
            <div id="standalone-submit-area" class="hidden bg-white border border-slate-200 rounded-2xl p-5 flex justify-end shadow-sm">
                <button onclick="submitStandaloneExam(false)" class="bg-violet-600 hover:bg-violet-700 text-white px-7 py-3 rounded-xl text-sm font-bold"><i class="fa-solid fa-paper-plane mr-1.5"></i>Submit Examination</button>
            </div>
            <div id="standalone-result" class="hidden bg-slate-900 text-white rounded-2xl p-6 shadow-lg"></div>
        </section>
    </main>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/supabase-data.js"></script>
    <script src="js/exam.js"></script>
</body>
</html>
